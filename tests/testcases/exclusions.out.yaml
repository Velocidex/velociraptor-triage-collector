Output: []

Query: LET _ <= copy(filename="retained", accessor="data", dest=Root + "/OneDrive/logs/ListSync/adaptive.exe", create_directories=TRUE)
Output: []

Query: LET _ <= mock(plugin="glob", results={ SELECT * FROM foreach(row=[Root + "/OneDrive/ListSync/cache.db", Root + "/OneDrive/logs/ListSync/sync.log"], query={ SELECT *, split(string="fixture", sep_string=",") AS Globs FROM stat(filename=_value) }) })
Output: []

Query: LET _ <= mock(artifact=Artifact.Windows.System.Services, results=[dict(AbsoluteExePath=Root + "/OneDrive/ListSync/adaptive.exe"), dict(AbsoluteExePath=Root + "/OneDrive/logs/ListSync/adaptive.exe")])
Output: []

Query: LET _ <= mock(function="upload", results=dict(Path="mock-upload"))
